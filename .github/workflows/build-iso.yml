name: Build Cranberry OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Instalar live-build y herramientas de arranque
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build isolinux syslinux-common syslinux-efi grub-pc-bin grub-efi-amd64-bin mtools xorriso dosfstools

      - name: Configurar la imagen (solo terminal, sin entorno grafico)
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architecture amd64 \
            --binary-images iso \
            --archive-areas "main contrib non-free non-free-firmware" \
            --firmware-chroot false \
            --firmware-binary false \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --security false

      - name: Agregar el kernel y herramientas de arranque dentro del sistema
        run: |
          mkdir -p config/package-lists
          printf "linux-image-amd64\nisolinux\nsyslinux-common\n" > config/package-lists/kernel.list.chroot

      - name: Arreglar las rutas viejas de isolinux dentro del sistema
        run: |
          mkdir -p config/hooks/normal
          printf '#!/bin/sh\nset -e\nmkdir -p /usr/lib/syslinux\nln -sf /usr/lib/ISOLINUX/isolinux.bin /usr/lib/syslinux/isolinux.bin\nln -sf /usr/lib/syslinux/modules/bios/vesamenu.c32 /usr/lib/syslinux/vesamenu.c32\n' > config/hooks/normal/9010-fix-isolinux-paths.hook.chroot
          chmod +x config/hooks/normal/9010-fix-isolinux-paths.hook.chroot

      - name: Copiar archivos de marca de Cranberry OS
        run: |
          mkdir -p config/includes.chroot/etc
          cp files/etc/issue      config/includes.chroot/etc/issue
          cp files/etc/motd       config/includes.chroot/etc/motd
          cp files/etc/os-release config/includes.chroot/etc/os-release
          cp files/etc/bash.bashrc config/includes.chroot/etc/bash.bashrc

      - name: Construir la ISO
        run: sudo lb build

      - name: Renombrar la ISO
        run: |
          ISO_FILE=$(ls *.iso | head -n1)
          mv "$ISO_FILE" cranberry-os.iso

      - name: Subir la ISO como descarga
        uses: actions/upload-artifact@v4
        with:
          name: cranberry-os-iso
          path: cranberry-os.iso
          retention-days: 14
