name: Build Cranberry OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Instalar live-build y herramientas de arranque
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build isolinux syslinux-common syslinux-efi syslinux-utils \
            grub-pc-bin grub-efi-amd64-bin mtools xorriso dosfstools \
            librsvg2-bin

      - name: Arreglar bug de Ubuntu en live-build (hack de gfxboot bootlogo)
        run: |
          sudo sed -i '/# Hack around the removal of support in gfxboot/,/rm -rf "\$tmpdir"/d' /usr/lib/live/build/lb_binary_syslinux

      - name: Crear tema isolinux con isolinux.bin y modulos reales
        run: |
          mkdir -p config/bootloaders/isolinux
          cp -a /usr/share/live/build/bootloaders/isolinux/. config/bootloaders/isolinux/
          find /usr/lib -iname "isolinux.bin" -exec cp -v {} config/bootloaders/isolinux/ \;
          find /usr/lib/syslinux/modules/bios -iname "*.c32" -exec cp -v {} config/bootloaders/isolinux/ \;

      - name: Configurar la imagen (solo terminal, sin entorno grafico)
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architecture amd64 \
            --binary-images iso \
            --archive-areas "main contrib non-free non-free-firmware" \
            --firmware-chroot false \
            --firmware-binary false \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --security false

      - name: Agregar el kernel y herramientas de arranque dentro del sistema
        run: |
          mkdir -p config/package-lists
          printf "linux-image-amd64\nisolinux\nsyslinux-common\nlibrsvg2-bin\n" > config/package-lists/kernel.list.chroot

      - name: Agregar el escritorio completo Nexus (X11, IceWM, archivos, terminal, navegador)
        run: |
          mkdir -p config/package-lists
          printf "xserver-xorg\nxinit\nxserver-xorg-video-all\nxserver-xorg-input-all\nicewm\nxterm\nlxterminal\npcmanfm\nfirefox-esr\nadwaita-icon-theme\n" > config/package-lists/nexus.list.chroot

      - name: Arreglar rutas viejas dentro del sistema
        run: |
          mkdir -p config/hooks
          printf '#!/bin/sh\nset -e\nmkdir -p /usr/lib/syslinux\nln -sf /usr/lib/ISOLINUX/isolinux.bin /usr/lib/syslinux/isolinux.bin\nln -sf /usr/lib/syslinux/modules/bios/vesamenu.c32 /usr/lib/syslinux/vesamenu.c32\nchmod +x /usr/bin/rsvg\n' > config/hooks/999-fix-isolinux-paths.chroot
          chmod +x config/hooks/999-fix-isolinux-paths.chroot

      - name: Ponerle contrasena a root
        run: |
          mkdir -p config/hooks
          printf '#!/bin/sh\nset -e\necho "root:cranberry" | chpasswd\n' > config/hooks/998-set-root-password.chroot
          chmod +x config/hooks/998-set-root-password.chroot

      - name: Configurar escritorio Nexus (tema propio, iconos, escritorio, navegador)
        run: |
          mkdir -p config/hooks
          cat > config/hooks/997-nexus-desktop.chroot << 'HOOK'
          #!/bin/sh
          set -e

          mkdir -p /root/.icewm
          mkdir -p /root/Desktop
          mkdir -p /root/.config/pcmanfm/default

          printf 'Look="flat"\nIconThemeName="Adwaita"\nActiveBorderBg="#1a1a21"\nInactiveBorderBg="#0d0d10"\nActiveTitleBarBg="#17171c"\nActiveTitleBarFg="#e0559f"\nInactiveTitleBarBg="#0d0d10"\nInactiveTitleBarFg="#6b6b75"\nMenuBg="#131318"\nMenuFg="#e8e6ea"\nActiveMenuItemBg="#e0559f"\nActiveMenuItemFg="#000000"\nTaskBarBg="#131318"\nTaskBarFg="#e0559f"\nButtonBg="#1a1a21"\nButtonFg="#e8e6ea"\n' > /root/.icewm/preferences

          printf 'prog "Terminal" utilities-terminal lxterminal\nprog "Archivos" system-file-manager pcmanfm\nprog "Navegador" web-browser firefox-esr\n' > /root/.icewm/toolbar

          printf '[Desktop Entry]\nType=Application\nName=Terminal\nExec=lxterminal\nIcon=utilities-terminal\n' > /root/Desktop/terminal.desktop
          printf '[Desktop Entry]\nType=Application\nName=Archivos\nExec=pcmanfm\nIcon=system-file-manager\n' > /root/Desktop/files.desktop
          printf '[Desktop Entry]\nType=Application\nName=Navegador\nExec=firefox-esr\nIcon=web-browser\n' > /root/Desktop/firefox.desktop
          chmod +x /root/Desktop/terminal.desktop /root/Desktop/files.desktop /root/Desktop/firefox.desktop

          printf '[*]\nwallpaper_mode=stretch\nwallpaper=/usr/share/backgrounds/cranberry-nexus-wallpaper.jpg\ndesktop_bg=#0b0b0e\ndesktop_fg=#e8e6ea\ndesktop_shadow=#000000\nshow_wm_menu=0\n' > /root/.config/pcmanfm/default/desktop-items-0.conf

          printf 'pcmanfm --desktop --profile default &\nexec icewm-session\n' > /root/.xinitrc
          chmod +x /root/.xinitrc
          HOOK
          chmod +x config/hooks/997-nexus-desktop.chroot

      - name: Arrancar directo al escritorio (autologin, sin pedir usuario/clave)
        run: |
          mkdir -p config/hooks
          cat > config/hooks/996-nexus-autologin.chroot << 'HOOK'
          #!/bin/sh
          set -e
          mkdir -p /etc/systemd/system/getty@tty1.service.d
          printf '%s\n' '[Service]' 'ExecStart=' 'ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM' > /etc/systemd/system/getty@tty1.service.d/override.conf
          printf '%s\n' 'if [ -z "$DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ]; then' '  exec startx' 'fi' >> /root/.bash_profile
          HOOK
          chmod +x config/hooks/996-nexus-autologin.chroot

      - name: Copiar archivos de marca de Cranberry OS
        run: |
          mkdir -p config/includes.chroot/etc
          mkdir -p config/includes.chroot/usr/bin
          mkdir -p config/includes.chroot/usr/share/backgrounds
          cp files/etc/issue      config/includes.chroot/etc/issue
          cp files/etc/motd       config/includes.chroot/etc/motd
          cp files/etc/os-release config/includes.chroot/etc/os-release
          cp files/etc/bash.bashrc config/includes.chroot/etc/bash.bashrc
          cp files/usr/bin/rsvg   config/includes.chroot/usr/bin/rsvg
          cp files/usr/share/backgrounds/cranberry-nexus-wallpaper.jpg config/includes.chroot/usr/share/backgrounds/cranberry-nexus-wallpaper.jpg

      - name: Construir la ISO
        run: sudo lb build

      - name: Renombrar la ISO
        run: |
          ISO_FILE=$(ls *.iso | head -n1)
          mv "$ISO_FILE" cranberry-os.iso

      - name: Subir la ISO como descarga
        uses: actions/upload-artifact@v4
        with:
          name: cranberry-os-iso
          path: cranberry-os.iso
          retention-days: 14
