    height: 100vh; position: relative;

  /* -------- Desktop icons -------- */
  .desktop { position: absolute; top: 24px; left: 20px; display: flex; flex-direction: column; gap: 22px; }
  .icon { width: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .icon .glyph {
    width: 42px; height: 42px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.25);
  }
  .icon span { color: #fff; font-size: 11px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.7); line-height: 1.2; }
  .icon:active .glyph { background: rgba(90,150,230,0.5); }

  /* -------- Taskbar -------- */
  .taskbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 44px;
    background: linear-gradient(180deg, rgba(30,60,110,0.55), rgba(10,25,55,0.75));
    backdrop-filter: blur(6px);
    border-top: 1px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; padding: 0 6px; gap: 8px;
  }

  .start-orb {
    width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7fd0ff, #1f8fe0 45%, #0a4fa0 80%);
    border: 1px solid rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 16px; cursor: pointer;
    box-shadow: 0 0 8px rgba(60,150,255,0.6);
  }
  .start-orb:active { filter: brightness(0.85); }

  .taskbar-apps { display: flex; gap: 6px; flex: 1; height: 32px; }
  .taskbar-app {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 3px; color: #eaf3ff; font-size: 12px; padding: 0 12px;
    display: flex; align-items: center; cursor: pointer;
  }
  .taskbar-app:hover { background: rgba(255,255,255,0.18); }

  .clock {
    color: #eaf3ff; font-size: 12px; padding: 0 12px; text-align: right; line-height: 1.2;
    border-left: 1px solid rgba(255,255,255,0.2);
  }

  /* -------- Start menu -------- */
  .start-menu {
    position: absolute; bottom: 46px; left: 6px; width: 260px;
    background: linear-gradient(180deg, rgba(20,40,80,0.92), rgba(10,20,45,0.96));
    border: 1px solid rgba(255,255,255,0.3); border-radius: 6px 6px 0 0;
    backdrop-filter: blur(8px);
    display: none; flex-direction: column; overflow: hidden;
  }
  .start-menu.open { display: flex; }
  .start-menu .header {
    padding: 12px 14px; color: #fff; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .start-menu .item {
    padding: 10px 14px; color: #eaf3ff; font-size: 13px;
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .start-menu .item:hover { background: rgba(120,180,255,0.25); }
  .start-menu .item .glyph { font-size: 16px; width: 20px; text-align: center; }

  /* -------- Toast (feedback when launching) -------- */
  .toast {
    position: absolute; top: 20px; right: 20px;
    background: rgba(10,20,45,0.85); color: #eaf3ff; font-size: 12px;
    padding: 10px 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25);
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .brand { position: absolute; top: 20px; right: 20px; color: rgba(255,255,255,0.5); font-size: 13px; letter-spacing: 1px; }
</style>
</head>
<body>

  <div class="brand" id="brand">Cranberry OS</div>

  <div class="desktop">
    <div class="icon" onclick="launch('files')">
      <div class="glyph">🗀</div>
      <span>Mi PC</span>
    </div>
    <div class="icon" onclick="launch('firefox')">
      <div class="glyph">🌐</div>
      <span>Internet</span>
    </div>
    <div class="icon" onclick="launch('terminal')">
      <div class="glyph">&gt;_</div>
      <span>Terminal</span>
    </div>
  </div>

  <div class="start-menu" id="startMenu">
    <div class="header">root@cranberry</div>
    <div class="item" onclick="launch('firefox'); toggleStart()"><span class="glyph">🌐</span> Internet</div>
    <div class="item" onclick="launch('files'); toggleStart()"><span class="glyph">🗀</span> Explorador de archivos</div>
    <div class="item" onclick="launch('terminal'); toggleStart()"><span class="glyph">&gt;_</span> Terminal</div>
  </div>

  <div class="taskbar">
    <div class="start-orb" onclick="toggleStart()">❖</div>
    <div class="taskbar-apps" id="taskbarApps"></div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  function toggleStart() {
    document.getElementById('startMenu').classList.toggle('open');
  }

  document.addEventListener('click', function(e) {
    var menu = document.getElementById('startMenu');
    var orb = document.querySelector('.start-orb');
    if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== orb) {
      menu.classList.remove('open');
    }
  });

  var LAUNCHER = 'http://127.0.0.1:4001/launch?app=';

  function launch(app) {
    fetch(LAUNCHER + app).catch(function() {});
    showToast('Abriendo ' + labelFor(app) + '...');
  }

  function labelFor(app) {
    if (app === 'firefox') return 'Internet';
    if (app === 'files') return 'Explorador de archivos';
    if (app === 'terminal') return 'Terminal';
    return app;
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 1800);
  }

  function tickClock() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var days = ['dom','lun','mar','mie','jue','vie','sab'];
    document.getElementById('clock').innerHTML = h + ':' + m + '<br>' + days[now.getDay()] + ' ' + now.getDate();
  }
  tickClock();
  setInterval(tickClock, 15000);
</script>

</body>
</html>
